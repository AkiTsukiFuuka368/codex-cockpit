name: Windows build (with Claude support)
# Builds an unsigned Windows installer from this fork and publishes it as a
# pre-release, so it can be downloaded without a Rust toolchain.
on:
  workflow_dispatch:
  push:
    branches: [claude-support]
permissions:
  contents: write
concurrency:
  group: windows-claude-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    env:
      # Point the in-app updater at this fork so it never swaps in an upstream build without Claude support.
      COCKPIT_UPDATES_REPOSITORY: ${{ github.repository }}
      VITE_RELEASE_URL: https://github.com/${{ github.repository }}/releases
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test -- --maxWorkers=2
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build installer
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="claude-build-${GITHUB_RUN_NUMBER}"
          sha256sum src-tauri/target/release/bundle/nsis/*.exe > SHA256SUMS.txt
          gh release create "$tag" src-tauri/target/release/bundle/nsis/*.exe SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "Codex Cockpit + Claude (build ${GITHUB_RUN_NUMBER})" \
            --notes "Unsigned Windows installer built from ${GITHUB_SHA} on branch ${GITHUB_REF_NAME}. Adds a Claude quota card and a Claude usage page."
